[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.0", "wheel"]

[project]
authors = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "equinox>=0.13.0,<0.14",
  "evosax>=0.2.0,<0.3",
  "f3dasm",
  "flax>=0.12.0",
  "hydra-core>=1.3.2",
  "jax>=0.4.30,<=0.9.1",
  "jax-tqdm>=0.4.0",
  "jaxtyping>=0.3.2",
  "omegaconf",
  "optax>=0.2.5"
]
description = "Bare optimizers compatible with the L2CO library"
keywords = ["optimization", "optimizers", "jax", "evolution-strategies"]
license = "BSD-3-Clause"
maintainers = [
  {email = "m.p.vanderschelling@tudelft.nl", name = "Martin van der Schelling"}
]
name = "l2co-optimizers"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.2.0"

[project.optional-dependencies]
dev = [
  "setuptools>=77.0.0",
  "build",
  "wheel",
  "pre-commit>=4.4.0",
  "ruff>=0.14.10"
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-include-exclude-files>=0.1.0",
  "mkdocs-ipynb>=0.1.1",
  "mkdocs-material>=9.6.20",
  "mkdocstrings>=0.30.1",
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.16.1"
]
tests = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1"
]

[project.urls]
bugs = "https://github.com/bessagroup/l2co-optimizers/issues"
homepage = "https://github.com/bessagroup/l2co-optimizers"

[tool.pytest.ini_options]
filterwarnings = [
  "error::DeprecationWarning:l2co_optimizers"
]
markers = [
  "slow: test runs a long optimization loop",
  "requires_f3dasm: test constructs an f3dasm.ExperimentData"
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv-docker"]
# Respect the excludes even when pre-commit passes file names explicitly.
force-exclude = true
line-length = 79

[tool.ruff.lint]
exclude = [
  "__pycache__",
  "dist",
  "*.egg",
  "tests",
  ".git"
]
ignore = [
  "E226",
  "E3",
  "E731",
  "C901",
  "F722",
  "UP045",
  "B027",
  "B012"
]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "UP", # pyupgrade
  "TID251" # flake8-tidy-imports banned-api
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"l2co".msg = "l2co-optimizers must not import l2co (l2co depends on this package)."
"l2co_tasks".msg = "l2co-optimizers must not import l2co_tasks; take model/loss_fn/pass_rng instead (l2co ADR 0018)."

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools.package-data]
"l2co_optimizers.conf" = ["**/*.yaml"]

[tool.uv]
package = true

[tool.uv.sources]
f3dasm = {editable = true, path = "../f3dasm"}
