version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Install the package with its docs extra (mkdocs-material, mkdocstrings, ...);
    # without this RTD only installs bare mkdocs and the 'material' theme is missing.
    pre_install:
      - python -m pip install --upgrade pip
      - python -m pip install '.[docs]'

# Build documentation with Mkdocs
mkdocs:
   configuration: mkdocs.yml
