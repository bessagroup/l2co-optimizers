name: Build docs
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2co-optimizers
        uses: actions/checkout@v4
        with:
          path: l2co-optimizers
      # f3dasm is an editable sibling dep ([tool.uv.sources] path
      # "../f3dasm"); a push to main builds against its main.
      - name: Checkout f3dasm (sibling editable dep)
        uses: actions/checkout@v4
        with:
          repository: bessagroup/f3dasm
          path: f3dasm
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install docs extras
        working-directory: l2co-optimizers
        run: uv sync --extra docs
      - name: Build docs
        working-directory: l2co-optimizers
        run: uv run mkdocs build
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: l2co-optimizers/site
