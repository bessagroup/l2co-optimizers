# modOpt's OpenSQP at its defaults (ADR 0010). A plain-run entry only: it
# cannot appear in a switching menu. It needs LSDOlab's modOpt, which is
# not a dependency of this package: install it with the opensqp
# dependency group (uv sync --group opensqp). Its cost per evaluation
# grows steeply with the dimensionality, from a few hundred dimensions
# with a box and about a thousand without; there a cell can exceed a
# cluster's wall-clock limit.
- _target_: l2co_optimizers.OptimizationStep
  optimizer: opensqp
