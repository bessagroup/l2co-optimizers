# The scipy.optimize minimisers at their defaults (ADRs 0002, 0003, 0006).
# Plain-run entries only: they cannot appear in a switching menu. COBYQA's
# cost per step grows steeply with the dimensionality, and SLSQP's and
# trust-constr's above about a thousand dimensions; there a cell can
# exceed a cluster's wall-clock limit.
- _target_: l2co_optimizers.OptimizationStep
  optimizer: cobyqa
- _target_: l2co_optimizers.OptimizationStep
  optimizer: powell
- _target_: l2co_optimizers.OptimizationStep
  optimizer: tnc
- _target_: l2co_optimizers.OptimizationStep
  optimizer: trustkrylov
- _target_: l2co_optimizers.OptimizationStep
  optimizer: slsqp
- _target_: l2co_optimizers.OptimizationStep
  optimizer: trustconstr
- _target_: l2co_optimizers.OptimizationStep
  optimizer: lbfgsb
