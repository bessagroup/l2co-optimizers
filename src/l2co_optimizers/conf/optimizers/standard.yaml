# Standard optimizer set with early stopping enabled for gradient-based methods
- _target_: l2co_optimizers.OptimizationStep
  optimizer: snes
- _target_: l2co_optimizers.OptimizationStep
  optimizer: simulatedannealing
- _target_: l2co_optimizers.OptimizationStep
  optimizer: cmaes
  stopping_criteria:
    type: covariance_matrix
    tol: 1e-12
- _target_: l2co_optimizers.OptimizationStep
  optimizer: adam
  hyperparameters:
    learning_rate: 1e-2
  stopping_criteria:
    type: combined
    grad_tol: 1e-3
    loss_tol: 1e-6
- _target_: l2co_optimizers.OptimizationStep
  optimizer: adam
  hyperparameters:
    learning_rate: 1e-1
  stopping_criteria:
    type: combined
    grad_tol: 1e-3
    loss_tol: 1e-6
- _target_: l2co_optimizers.OptimizationStep
  optimizer: pso
- _target_: l2co_optimizers.OptimizationStep
  optimizer: lbfgs
  stopping_criteria:
    type: combined
    grad_tol: 1e-3
    loss_tol: 1e-6
