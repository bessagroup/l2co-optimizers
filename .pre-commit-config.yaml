repos:
  - repo: local
    hooks:
      - id: sort_pyproject
        name: sort_pyproject
        entry: toml-sort -i --sort-table-keys --sort-inline-tables
        language: python
        files: ^pyproject\.toml$
        additional_dependencies: ["toml-sort==0.23.1"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      # NOTE: no `toml` in types_or — ruff only parses Python/notebook
      # sources; feeding it pyproject.toml/uv.lock produces thousands of
      # bogus invalid-syntax errors (pyproject is kept tidy by the
      # sort_pyproject hook above instead).
      - id: ruff-format # formatter
        types_or: [python, pyi, jupyter]
      - id: ruff-check # linter
        types_or: [python, pyi, jupyter]
        args: [--fix]
